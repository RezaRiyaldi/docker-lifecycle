# HTTP local option. Nginx does not load this file while it ends in
# .example; copy it to localhost.conf in the mounted Nginx config directory.
# It can run alongside pXX.conf for simultaneous HTTP and HTTPS access.
# Disable pXX.conf only if you want HTTP-only access.
#
# URLs: http://localhost/p56/<project>/ through /p85/<project>/.
# App files are served from /var/www/pXX/<project>.
# Start the matching PHP-FPM service for every version you want to use.

server {
    listen 80 default_server;
    server_name localhost 127.0.0.1;
    client_max_body_size 12m;
    resolver 127.0.0.11 valid=10s;
    root $web_root;
    index index.php index.html;

    location ~ ^/p56/[^/]+/ret_core_v2/assets/ {
        alias /var/www/p56/ret_core_v2/assets/;
        access_log off;
        expires 7d;
    }

    location ~ ^/p(?<asset_version>56|74|80|81|82|83|84|85)/[^/]+/ret_core_v3/assets/ {
        alias /var/www/p$asset_version/ret_core_v3/assets/;
        access_log off;
        expires 7d;
    }

    location ~ ^/p(?<php_version>56|74|80|81|82|83|84|85)/(?<project>[^/]+)(?<app_path>/.*)?$ {
        set $php_fpm_version $php_version;
        set $app_root /var/www/p$php_version/$project;
        set $app_root_uri /p$php_version/$project;
        set $app_uri $app_path;
        set $web_root $app_root;

        if (-d $app_root/public) {
            set $web_root $app_root/public;
        }
        if ($app_uri = "") {
            set $app_uri /;
        }

        rewrite ^/p(?:56|74|80|81|82|83|84|85)/[^/]+(/.*)$ $1 last;
        rewrite ^/p(?:56|74|80|81|82|83|84|85)/[^/]+/?$ / last;
    }

    location / {
        if ($app_root = "") {
            return 404;
        }
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        if ($app_root = "") {
            return 404;
        }
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass php$php_fpm_version:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param REQUEST_URI $app_uri$is_args$args;
    }
}
