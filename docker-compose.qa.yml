networks:
  default:
    name: docker-network
    attachable: true

include:
  - compose-qa/server.yml
  - compose-qa/php.yml
  - compose-qa/node.yml
  - compose-qa/database.yml
  - compose-qa/tools.yml
  # - compose-qa/supabase.yml
  - compose-qa/radius.yml
  - compose-qa/proxy.yml

volumes:
  mysql-data:
    external: false
  mysql57-data:
    external: false
  postgres-data:
    external: false
  redis-data:
    external: false
  minio-data:
    driver: local
  supabase-db-data:
    driver: local
  supabase-storage-data:
    driver: local
