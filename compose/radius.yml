services:
  freeradius:
    # Tag seri 3.2 (rilis stabil). Untuk mengunci versi, ganti dengan tag
    # versi spesifik yang ada di Docker Hub.
    image: freeradius/freeradius-server:latest-3.2
    container_name: docker-freeradius
    restart: always
    # "-X" = mode debug penuh (log lengkap di `docker logs`). Cocok untuk lab.
    # Untuk jalan normal, ganti dengan: command: ["-l", "stdout"]
    command: ["-X"]
    ports:
      # RADIUS bukan HTTP, jadi tidak lewat Caddy/nginx. UDP dipublish langsung.
      - "127.0.0.1:1812:1812/udp"   # autentikasi
      - "127.0.0.1:1813:1813/udp"   # accounting
    environment:
      TZ: Asia/Jakarta
      # Secret bersama antara MikroTik dan FreeRADIUS (/radius add ... secret=)
      RADIUS_SECRET: ${QA_RADIUS_SECRET:?QA_RADIUS_SECRET belum di atur}
      # Koneksi ke Postgres milik stack ini (service "postgres" di database.yml)
      RADIUS_DB_HOST: postgres
      RADIUS_DB_NAME: radius
      RADIUS_DB_USER: radius
      RADIUS_DB_PASSWORD: ${QA_RADIUS_DB_PASSWORD:?QA_RADIUS_DB_PASSWORD belum diatur}
    volumes:
      - ../freeradius/clients.conf:/etc/freeradius/clients.conf:ro
      - ../freeradius/sql:/etc/freeradius/mods-enabled/sql:ro
    depends_on:
      - postgres
    networks:
      - default
