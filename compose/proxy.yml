services:
  caddy:
    image: caddy:2
    container_name: dev-caddy
    profiles: ["server"]
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ../docker-volumes/caddy-data:/data
      - ../docker-volumes/caddy-config:/config
    depends_on:
      - nginx
    networks:
      - default
