services:
  supabase-db:
    container_name: docker-supabase-db
    image: supabase/postgres:15.8.1.060
    restart: always
    environment:
      POSTGRES_PASSWORD: r3tSupabase
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
    ports:
      - "54321:5432"
    volumes:
      - supabase-db-data:/var/lib/postgresql/data
      - ../supabase/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    networks:
      - default

  supabase-kong:
    container_name: docker-supabase-kong
    image: kong:2.8.1
    restart: always
    depends_on:
      - supabase-auth
      - supabase-rest
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /var/lib/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
    ports:
      - "54320:8000"
    volumes:
      - ../supabase/kong.yml:/var/lib/kong/kong.yml:ro
    networks:
      - default

  supabase-auth:
    container_name: docker-supabase-auth
    image: supabase/gotrue:v2.177.0
    restart: always
    depends_on:
      - supabase-db
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://localhost:54320
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://postgres:r3tSupabase@supabase-db:5432/postgres?sslmode=disable&search_path=auth
      GOTRUE_SITE_URL: http://localhost:3024
      GOTRUE_URI_ALLOW_LIST: http://localhost:3020,http://localhost:3022,http://localhost:3024
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      # SMTP via maildev (sudah jalan di stack tools, port 1025)
      GOTRUE_SMTP_HOST: maildev
      GOTRUE_SMTP_PORT: "1025"
      # maildev tanpa auth (STARTTLS tidak didukung gomail); lihat compose/tools.yml
      GOTRUE_SMTP_ADMIN_EMAIL: admin@example.com
      GOTRUE_SMTP_SENDER_NAME: Supabase Auth
      # Email yang dikirim GoTrue merujuk path di app
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/confirm
      GOTRUE_MAILER_URLPATHS_RECOVERY_REDIRECT: http://localhost:3024/auth/confirm
      # GOTRUE_MAILER_URLPATHS_RECOVERY_REDIRECT: http://localhost:3024/update-password
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/confirm
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/confirm
      # OAuth (kosongkan = provider dinonaktifkan; isi di docker/.env)
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: "true"
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: http://localhost:54320/auth/v1/callback
      GOTRUE_EXTERNAL_GITHUB_ENABLED: "true"
      GOTRUE_EXTERNAL_GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GITHUB_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GOTRUE_EXTERNAL_GITHUB_REDIRECT_URI: http://localhost:54320/auth/v1/callback
      GOTRUE_EXTERNAL_REDIRECT_URI: http://localhost:3024
    networks:
      - default

  supabase-rest:
    container_name: docker-supabase-rest
    image: postgrest/postgrest:v12.2.12
    restart: always
    depends_on:
      - supabase-db
    environment:
      PGRST_DB_URI: postgres://postgres:r3tSupabase@supabase-db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage,graphql_public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
      PGRST_DB_USE_LEGACY_GUCS: "false"
    networks:
      - default

  supabase-realtime:
    container_name: docker-supabase-realtime
    image: supabase/realtime:v2.34.47
    restart: always
    depends_on:
      - supabase-db
    environment:
      RLIMIT_NOFILE: "65535"
      APP_NAME: realtime-v2
      PORT: 4000
      DB_HOST: supabase-db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: r3tSupabase
      DB_NAME: postgres
      DB_AFTER_CONNECT_QUERY: "SET search_path TO _realtime"
      DB_ENC_KEY: supabaserealtimeencryptionkey32
      API_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
      SECRET_KEY_BASE: supabaserealtimesecretkeybase32chars
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
    networks:
      - default

  supabase-storage:
    container_name: docker-supabase-storage
    image: supabase/storage-api:v1.25.7
    restart: always
    depends_on:
      - supabase-db
      - supabase-rest
    environment:
      ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzg2NDcxNTAyLCJleHAiOjQxMDI0NDQ4MDB9.eTdB6XOmfAitlm0BJJ22huwD2y1aVrzHPvFx5ySFn2s
      SERVICE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoic2VydmljZV9yb2xlIiwiaXNzIjoic3VwYWJhc2UiLCJpYXQiOjE3ODY0NzE1MDIsImV4cCI6NDEwMjQ0NDgwMH0.04D9zC3l84csSjhVVVenr2UeRLFEUwGZcNIiaQsdixo
      POSTGREST_URL: http://supabase-rest:3000
      PGRST_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
      DATABASE_URL: postgres://postgres:r3tSupabase@supabase-db:5432/postgres
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: stub
      GLOBAL_S3_BUCKET: stub
    volumes:
      - supabase-storage-data:/var/lib/storage
    networks:
      - default

  supabase-meta:
    container_name: docker-supabase-meta
    image: supabase/postgres-meta:v0.89.3
    restart: always
    depends_on:
      - supabase-db
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: supabase-db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: r3tSupabase
    networks:
      - default

  supabase-studio:
    container_name: docker-supabase-studio
    image: supabase/studio:2025.06.30-sha-6f5982d
    restart: always
    depends_on:
      - supabase-kong
      - supabase-meta
    environment:
      STUDIO_PG_META_URL: http://supabase-meta:8080
      POSTGRES_PASSWORD: r3tSupabase
      DEFAULT_ORGANIZATION_NAME: Local
      DEFAULT_PROJECT_NAME: Docker Supabase
      SUPABASE_URL: http://supabase-kong:8000
      SUPABASE_PUBLIC_URL: http://localhost:54320
      SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzg2NDcxNTAyLCJleHAiOjQxMDI0NDQ4MDB9.eTdB6XOmfAitlm0BJJ22huwD2y1aVrzHPvFx5ySFn2s
      SUPABASE_SERVICE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoic2VydmljZV9yb2xlIiwiaXNzIjoic3VwYWJhc2UiLCJpYXQiOjE3ODY0NzE1MDIsImV4cCI6NDEwMjQ0NDgwMH0.04D9zC3l84csSjhVVVenr2UeRLFEUwGZcNIiaQsdixo
    ports:
      - "54323:3000"
    networks:
      - default
