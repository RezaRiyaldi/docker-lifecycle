services:
  nginx:
    image: nginx:latest
    container_name: dev-nginx
    ports:
      - "${NGINX_HTTP:-80:80}"
      # For both localhost and SSL domain access, keep both port mappings.
      # For HTTP-only access, comment out this HTTPS mapping.
      - "${NGINX_HTTPS:-8443:443}"
    volumes:
      # Sesuaikan path project anda di bawah ini dengan path project Anda.
      - ../../php/www:/var/www
      - ../../node/www:/var/www/node:ro
      - ../nginx:/etc/nginx/conf.d
      - ../ssl:/etc/nginx/ssl
    restart: always
    depends_on:
      php56:
        condition: service_started
      php74:
        condition: service_started
      php80:
        condition: service_started
      php81:
        condition: service_started
      php82:
        condition: service_started
      php83:
        condition: service_started
      php84:
        condition: service_started
      php85:
        condition: service_started
    networks:
      - default
