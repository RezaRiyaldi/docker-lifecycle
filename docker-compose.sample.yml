networks:
  default:
    name: docker-network
    attachable: true

include:
  - compose/server.yml
  - compose/php.yml
  - compose/node.yml
  - compose/database.yml
  - compose/tools.yml
  # - compose/supabase.yml
  - compose/radius.yml
  - compose/proxy.yml

volumes:
  mysql-data:
    external: false
  mysql57-data:
    external: false
  postgres-data:
    external: false
  redis-data:
    external: false
  minio-data:
    driver: local
  supabase-db-data:
    driver: local
  supabase-storage-data:
    driver: local
