# =============================================================================
# FreeRADIUS - daftar klien (NAS / MikroTik)
#
# LAB SAJA. Rentang IP privat di bawah dibuka supaya MikroTik di jaringan
# laptop bisa terhubung, dan karena Docker Desktop (Windows/macOS) sering
# mengubah alamat sumber paket UDP menjadi IP gateway Docker (172.x).
#
# Untuk server publik: hapus blok "lab-*" dan daftarkan MikroTik satu per satu
# (IP WireGuard-nya) lewat tabel "nas" di database, bukan rentang lebar.
# =============================================================================

# Untuk uji lokal: radtest ... 127.0.0.1 0 testing123
client localhost {
    ipaddr = 127.0.0.1
    proto  = *
    secret = testing123
    nas_type = other
}

client lab-docker {
    ipaddr = 172.16.0.0/12
    secret = $ENV{RADIUS_SECRET}
    nas_type = other
}

client lab-lan {
    ipaddr = 192.168.0.0/16
    secret = $ENV{RADIUS_SECRET}
    nas_type = other
}

client lab-10 {
    ipaddr = 10.0.0.0/8
    secret = $ENV{RADIUS_SECRET}
    nas_type = other
}
